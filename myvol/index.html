<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Undangan & Dashboard 💖</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            background: linear-gradient(to right, #1d2baf, #ffe6f0);
        }

        h1 { color: #cc0066; }
        h2 { color: #99004d; }

        .card {
            background: white;
            display: inline-block;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 500px;
            margin-top: 30px;
        }

        button {
            background: #cc0066;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #99004d;
        }

        ul {
            text-align: left;
            margin-top: 15px;
        }

        .heart {
            position: fixed;
            top: -10px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }
    </style>
</head>

<body>

<div class="card">
    <h1>💖 Undangan Pernikahan 💖</h1>

    <p>
        Dengan memohon rahmat dan ridho Allah SWT,<br>
        kami mengundang Anda dalam pernikahan:
    </p>

    <h2>Abdul Aziz ❤️ Aafiyaah</h2>

    <p>
        <b>Sabtu, 20 Mei 2026</b><br>
        10.00 WIB - Selesai<br>
        Gedung Serbaguna Bahagia
    </p>

    <hr>

    <h2>📊 Data Tamu (API)</h2>

    <button onclick="loadUsers()">Ambil Data</button>

    <ul id="list">
        <li>Belum ada data...</li>
    </ul>
</div>

<script>
function loadUsers() {
    fetch('/api/users')
        .then(res => {
            if (!res.ok) {
                throw new Error("API error: " + res.status);
            }
            return res.json();
        })
        .then(data => {
            let html = "";
            data.forEach(user => {
                html += `<li><b>${user.nama}</b><br><small>${user.email}</small></li>`;
            });
            document.getElementById("list").innerHTML = html;
        })
        .catch(err => {
            document.getElementById("list").innerHTML =
                "<li style='color:red'>Error: " + err.message + "</li>";
        });
}

// animasi love
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
